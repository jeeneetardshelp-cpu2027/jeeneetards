
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Free JEE, NEET and board exam video lectures from top YouTube teachers, organised by class, subject and chapter." />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="JEENEETARD" />
    <meta name="google-site-verification" content="7yEuDEQPeBynhlyy9_xJWkGH7fe-8Zq2qJqLSSFFkw8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Self-hosted Inter variable (CSP font-src 'self'). Preloaded because it
         renders the hero headline: without this the first paint uses the
         fallback stack and the h1 visibly reflows. crossorigin is required on
         font preloads even same-origin, or the browser fetches it twice. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- No static canonical: this shell is served for EVERY route, so a fixed
         canonical would tell crawlers every page is really the homepage.
         Course pages get their canonical from the edge middleware (ogInject.js);
         all routes get it client-side from PageMetadata.jsx. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JEENEETARD" />
    <meta property="og:title" content="Free JEE &amp; NEET video lectures, chapter by chapter | JEENEETARD" />
    <meta property="og:description" content="Free JEE, NEET and board exam video lectures from top YouTube teachers, organised by class, subject and chapter." />
    <meta property="og:url" content="https://www.jeeneetard.com/" />
    <meta property="og:image" content="https://www.jeeneetard.com/social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="JEENEETARD - a free educational YouTube course directory"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Free JEE &amp; NEET video lectures, chapter by chapter | JEENEETARD" />
    <meta name="twitter:description" content="Free JEE, NEET and board exam video lectures from top YouTube teachers, organised by class, subject and chapter." />
    <meta name="twitter:image" content="https://www.jeeneetard.com/social-preview.png" />
    <script src="/theme-init.js"></script>
    <!-- Inline CSS only (script-src is 'self'; style-src allows inline). This
         paints the correct canvas colour and a loading hairline before the
         bundle has parsed, so the first frame is never a white flash. React
         replaces #root's contents on mount, which removes it. -->
    <style>
      html[data-theme="dark"] { background: #0a0a0a; color-scheme: dark; }
      html[data-theme="light"] { background: #ffffff; color-scheme: light; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot-line {
        width: min(220px, 46vw); height: 2px; border-radius: 2px;
        background: rgba(128, 128, 128, 0.18); overflow: hidden;
      }
      .boot-line > i {
        display: block; height: 100%; width: 100%; border-radius: 2px;
        background: #24d3c4; transform-origin: 0 50%;
        animation: boot 1.15s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      html[data-theme="light"] .boot-line > i { background: #0f6f78; }
      @keyframes boot {
        0%   { transform: scaleX(0); opacity: 1; }
        70%  { transform: scaleX(1); opacity: 1; }
        100% { transform: scaleX(1); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-line > i { animation: none; transform: scaleX(0.35); }
      }
    </style>
    <title>Free JEE &amp; NEET video lectures, chapter by chapter | JEENEETARD</title>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading JEENEETARD">
        <div class="boot-line"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
