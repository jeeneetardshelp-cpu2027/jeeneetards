<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">JEENEETARD - Free course finder</title>
  <desc id="description">Browse free educational YouTube courses by exam, class, subject and chapter.</desc>
  <defs>
