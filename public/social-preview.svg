    <text x="204" y="168" fill="#A9BDC8" font-size="18" font-weight="600" letter-spacing="3">FREE EDUCATIONAL DIRECTORY</text>

    <text x="92" y="304" fill="#FFFFFF" font-size="68" font-weight="750">Find the right course,</text>
    <text x="92" y="384" fill="#37C0C8" font-size="68" font-weight="750">without the clutter.</text>

    <text x="96" y="454" fill="#D8E2EA" font-size="27">Browse free educational YouTube courses by</text>
