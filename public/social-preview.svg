      <stop offset="0" stop-color="#142A4F"/>
      <stop offset="1" stop-color="#0B1C39"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#37C0C8" stop-opacity=".32"/>
      <stop offset="1" stop-color="#37C0C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1040" cy="80" r="380" fill="url(#glow)"/>
  <circle cx="1130" cy="560" r="260" fill="none" stroke="#37C0C8" stroke-opacity=".13" stroke-width="2"/>
  <circle cx="1130" cy="560" r="190" fill="none" stroke="#37C0C8" stroke-opacity=".11" stroke-width="2"/>
  <path d="M760 0h440v630H940c-92-108-148-238-168-378C758 156 754 72 760 0Z" fill="#FFFFFF" fill-opacity=".025"/>

