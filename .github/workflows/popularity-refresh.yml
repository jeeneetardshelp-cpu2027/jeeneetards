# Popularity refresh: keep "Most popular" / "Most viewed" and the popularity
# tiebreak inside "Recommended" honest, by re-fetching YouTube view counts on a
# schedule.
#
# WHY A SCHEDULE. The job was manual, and the data it produces has a shelf
# life: refreshVideoStats.js treats a stat as fresh for REFRESH_INTERVAL_DAYS
# (7) and purges anything it could not refresh for 30 (YouTube's ToS ceiling
# for holding cached statistics). Run by hand once and forgotten, the ranking
# quietly stops meaning what it says, and after a month the purge empties
# video_stats and every course falls back to alphabetical — which is exactly
# the state the first run was fixing.
#
# CADENCE. Weekly, matching REFRESH_INTERVAL_DAYS, so each run refreshes the
# whole catalogue and nothing is ever more than a week stale. Staggered from
# video-liveness.yml (Sundays) onto Wednesdays: both jobs spend YouTube quota
# (~110 units of the 10,000/day allowance for this one) and there is no reason
# to have them contend on the same day.
#
# Runs src/scripts/refreshVideoStats.js (idempotent, safe to re-run). It exits
# non-zero on any failure, which reuses GitHub's "scheduled workflow failed"
# email as the alert — no bot token, nothing to configure.
#
# Requires the SAME three repository secrets as video-liveness.yml — they are
# the project's URL, service key and server YouTube key, not job-specific:
#   LIVENESS_SUPABASE_URL          — the project URL (same value as VITE_SUPABASE_URL)
#   LIVENESS_SUPABASE_SERVICE_KEY  — the service_role key (never ships to browsers)
#   LIVENESS_YOUTUBE_API_KEY       — the SERVER YouTube key (never VITE_YOUTUBE_API_KEY)
# The job fails fast with a clear message if any is missing.

name: popularity-refresh

on:
  schedule:
    - cron: "30 22 * * 3" # Wednesdays 22:30 UTC = Thursdays 04:00 IST, before the study day starts
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change, without writing to the database"
        type: boolean
        default: true

jobs:
  refresh:
    if: github.repository == 'jeeneetardshelp-cpu2027/jeeneetards'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # refreshVideoStats.js reads ../../.env relative to itself, not
      # process.env, so materialise the three values it needs into a .env file
      # for this run.
      - name: Write .env from secrets
        env:
          SUPABASE_URL: ${{ secrets.LIVENESS_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.LIVENESS_SUPABASE_SERVICE_KEY }}
          YT_KEY: ${{ secrets.LIVENESS_YOUTUBE_API_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SERVICE_KEY" ] || [ -z "$YT_KEY" ]; then
            echo "Missing one of LIVENESS_SUPABASE_URL / LIVENESS_SUPABASE_SERVICE_KEY / LIVENESS_YOUTUBE_API_KEY repo secrets." >&2
            exit 1
          fi
          {
            echo "VITE_SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY"
            echo "YOUTUBE_API_KEY=$YT_KEY"
          } > .env

      # Manual runs default to --dry-run so the plumbing can be tested without
      # touching production; the weekly schedule always runs for real.
      - name: Refresh popularity
        env:
          DRY_RUN_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: node src/scripts/refreshVideoStats.js $DRY_RUN_FLAG
