# Link-rot check: find lessons whose YouTube videos have been deleted, made
# private, or had embedding turned off — before a student does.
#
# CADENCE: the trigger is weekly but each video is checked about MONTHLY. The
# --max-age 30 flag skips anything verified within 30 days, so a weekly run only
# picks up what has aged past the cutoff; a run with nothing due exits before it
# calls YouTube at all, and costs one paginated read. Polling weekly rather than
# monthly just means newly-due videos wait at most 7 days instead of 30. Every
# row was stamped at once on 2026-09-01, so they currently all fall due together.
#
# Runs src/scripts/checkVideoLiveness.js (idempotent). Videos that stopped
# embedding are marked 'blocked' (the watch UI already shows an honest
# "YouTube only" link); deleted/private videos are marked 'unavailable' and
# reported for the owner to review — never auto-removed.
#
# The job then FAILS when anything needs a human, because checkVideoLiveness.js
# itself always exits 0 — see the last step.
#
# Requires three repository secrets (Settings → Secrets and variables → Actions):
#   LIVENESS_SUPABASE_URL          — the project URL (same value as VITE_SUPABASE_URL)
#   LIVENESS_SUPABASE_SERVICE_KEY  — the service_role key (never ships to browsers)
#   LIVENESS_YOUTUBE_API_KEY       — the SERVER YouTube key (never VITE_YOUTUBE_API_KEY)
# The job fails fast with a clear message if any is missing.

name: video-liveness

on:
  schedule:
    - cron: "30 22 * * 0" # Sundays 22:30 UTC = Mondays 04:00 IST, before the study day starts
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change, without writing to the database"
        type: boolean
        default: true

jobs:
  check:
    if: github.repository == 'jeeneetardshelp-cpu2027/jeeneetards'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # checkVideoLiveness.js reads ../../.env relative to itself, not process.env,
      # so materialise the three values it needs into a .env file for this run.
      - name: Write .env from secrets
        env:
          SUPABASE_URL: ${{ secrets.LIVENESS_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.LIVENESS_SUPABASE_SERVICE_KEY }}
          YT_KEY: ${{ secrets.LIVENESS_YOUTUBE_API_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SERVICE_KEY" ] || [ -z "$YT_KEY" ]; then
            echo "Missing one of LIVENESS_SUPABASE_URL / LIVENESS_SUPABASE_SERVICE_KEY / LIVENESS_YOUTUBE_API_KEY repo secrets." >&2
            exit 1
          fi
          {
            echo "VITE_SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY"
            echo "YOUTUBE_API_KEY=$YT_KEY"
          } > .env

      # Manual runs default to --dry-run so the plumbing can be tested without
      # touching production; the weekly schedule always runs for real.
      - name: Check video liveness
        env:
          DRY_RUN_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: node src/scripts/checkVideoLiveness.js --max-age 30 $DRY_RUN_FLAG

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-liveness-report
          path: tmp/video-liveness-report.json
          if-no-files-found: ignore
          retention-days: 90

      # checkVideoLiveness.js exits 0 whether or not it found rot, so without
      # this a scheduled run that discovered dead lessons would show a green
      # tick and tell nobody. Exiting non-zero re-uses GitHub's existing
      # "your scheduled workflow failed" email as the notification — no bot
      # token, no issue permissions, nothing new to configure:
      #   green = catalogue clean, red = go and look.
      # It also fails when the report is unreadable: not knowing whether the
      # catalogue is healthy must never be reported as healthy.
      - name: Fail if any lesson needs review
        run: node src/scripts/checkLivenessReport.js
